spring:
  application:
    name: synthara-research
  ai:
    openai:
      base-url: https://openrouter.ai/api
      api-key: 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
      chat:
        options:
          model: nvidia/nemotron-3-nano-30b-a3b:free
    mcp:
      client:
        stdio:
          connections:
            tavily-search-mcp:
              command: npx.cmd
              args:
                - -y
                - "tavily-mcp"
              env:
                TAVILY_API_KEY: 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
  datasource:
    url: jdbc:postgresql://localhost:5432/synthara_research
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:synthara_secure_pass}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1

synthara:
  research:
    output-dir: reports
    max-sources: 50
    parallel-research: true
    cache-ttl-hours: 24

embabel:
  agent:
    logging:
      personality: professional
    platform:
      models:
        openai:
          api-key: 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
          base-url: https://openrouter.ai/api
  models:
    default-llm: "nvidia/nemotron-3-nano-30b-a3b:free"
    llms:
      reviewer: "nvidia/nemotron-3-nano-30b-a3b:free"
