kind: Application
spring:
  application:
    name: synthara-research
  ai:
    openai:
      base-url: ${NVIDIA_NIM_BASE_URL:https://integrate.api.nvidia.com}
      api-key: ${NVIDIA_NIM_API_KEY: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}
      chat:
        options:
          model: ${NVIDIA_NIM_MODEL:stepfun-ai/step-3.7-flash}
    mcp:
      client:
        stdio:
          connections:
            tavily-search-mcp:
              command: ${TAVILY_MCP_COMMAND:npx}
              args:
                - -y
                - "tavily-mcp"
              env:
                TAVILY_API_KEY: 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
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/synthara_research
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 10000
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:synthara_secure_pass}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1

synthara:
  research:
    output-dir: reports
    max-sources: 50
    parallel-research: true
    cache-ttl-hours: 24

embabel:
  agent:
    logging:
      personality: colossus
    platform:
      models:
        openai:
          api-key: ${NVIDIA_NIM_API_KEY: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}
          base-url: ${NVIDIA_NIM_BASE_URL:https://integrate.api.nvidia.com}
  models:
    default-llm: stepfun-ai/step-3.7-flash
    llms:
      reviewer: stepfun-ai/step-3.7-flash


